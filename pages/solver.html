<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一元二次方程求解器</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #dbe3ef;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success-bg: #eef6ff;
            --success-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #f8fbff 0%, var(--bg) 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .form-row {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
        }

        input[type="text"] {
            width: 100%;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            font-size: 15px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .05s;
            margin-top: 6px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .result {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 46px;
            border-radius: 10px;
            border: 1px solid var(--success-border);
            background: var(--success-bg);
            color: #1e3a8a;
            line-height: 1.6;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="site-bar">
        <span>🧰 一元二次方程求解器</span>
        <a href="../index.html">← 返回首页</a>
    </div>
    <main class="card">
        <h1>一元二次方程求解器</h1>
        <p class="subtitle">请输入系数 a、b、c（方程形式：ax² + bx + c = 0）</p>

        <div class="form-row">
            <label for="a">请输入 a 的值</label>
            <input id="a" type="text" placeholder="例如：3">
        </div>

        <div class="form-row">
            <label for="b">请输入 b 的值</label>
            <input id="b" type="text" placeholder="例如：4">
        </div>

        <div class="form-row">
            <label for="c">请输入 c 的值</label>
            <input id="c" type="text" placeholder="例如：1">
        </div>

        <button class="btn" onclick="solve()">求解</button>

        <div class="result" id="result">结果将显示在这里</div>
    </main>

    <script>
        function solve(){
            var a=parseFloat(document.getElementById("a").value);
            var b=parseFloat(document.getElementById("b").value);
            var c=parseFloat(document.getElementById("c").value);
            var result=document.getElementById("result");

            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                result.textContent = "请输入有效数字。";
                return;
            }

            if (a === 0) {
                result.textContent = "a 不能为 0，否则这不是一元二次方程。";
                return;
            }

            var delta=b*b-4*a*c;
            if(delta<0){
                result.textContent = "该方程在实数范围内无解。";
            }
            else if(delta==0){
                var x=-b/(2*a);
                result.textContent = "方程有一个实数解：x1 = x2 = " + x;
            }
            else{
                var x1=(-b+Math.sqrt(delta))/(2*a);
                var x2=(-b-Math.sqrt(delta))/(2*a);
                result.textContent = "方程有两个实数解：x1 = " + x1 + "，x2 = " + x2;
            }
        }
    </script>
</body>
</html>
